[workspace]
members = ["crates/guard-dog", "crates/gd-core"]
# Resolver 3 is resolver 2 plus one thing: when picking dependency versions it
# prefers ones that build with our pinned Rust (`rust-version` below).
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/MaxSikorski/guard-dog"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
trybuild = "1.0"

[workspace.lints.rust]
# Guard Dog guards money. No crate of ours may use `unsafe`; a crate that ever
# truly needs it must lift this on purpose, with a reviewed reason.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `dbg!` and `todo!` must never reach `main`.
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
