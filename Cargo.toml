[workspace]
members = ["crates/guard-dog", "crates/gd-core", "crates/gd-egress", "crates/gd-demo", "crates/gd-demo-wasm"]
# Resolver 3 is resolver 2 plus one thing: when picking dependency versions it
# prefers ones that build with our pinned Rust (`rust-version` below).
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/MaxSikorski/guard-dog"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
trybuild = "1.0"
# JSON Schema checker for the advisory corpus test. No default features: no HTTP, no file resolving.
jsonschema = { version = "=0.60.2", default-features = false }
serde_json = "1"
# TOML reader for the release-profile policy test. Exact version already locked via trybuild.
toml = { version = "=1.1.8", default-features = false, features = ["parse", "std", "serde"] }
# YAML parser for the lab compose test. No default features (no encoding_rs).
yaml-rust2 = { version = "=0.13.0", default-features = false }
# Regex engine for the egress judge's secret-shape detectors. Exact version already locked via jsonschema.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode-perl"] }

[workspace.lints.rust]
# Guard Dog guards money. No crate of ours may use `unsafe`; a crate that ever
# truly needs it must lift this on purpose, with a reviewed reason.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `dbg!` and `todo!` must never reach `main`.
dbg_macro = "warn"
todo = "warn"
# Panic policy (Max, 2026-11-16): shipped code never panics on bad input.
# Handle the error, or return it. Tests are exempt (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

# Release builds unwind on panic (the default) so one crashing sensor can be
# contained and restarted. Abort will apply only to a future separate
# action-executor process (Max, 2026-11-16). Overflow checks stay on: wrong
# arithmetic must not silently wrap.
[profile.release]
lto = true
codegen-units = 1
overflow-checks = true
strip = true
