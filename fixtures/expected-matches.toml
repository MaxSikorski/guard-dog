# Judge B: what a correct advisory matcher must report, for every setup listed
# here and every advisory in advisories/corpus/. Written by hand BEFORE any
# matcher exists. Never loosen an entry to make the matcher pass without a
# written reason in the PR and in this file's history.
#
# Format and rules: fixtures/README.md ("Expected advisory matches").
# Checked by crates/gd-core/tests/expected_matches.rs.
#
# Each [[expect]] makes two separate calls, and the result follows from them:
#   version   = "in-range" | "out-of-range" | "unknown" | "not-applicable"
#               Only affected[] entries that apply to the setup count. An entry
#               whose database_specific.platform names a platform the setup is
#               not on (for example "32-bit systems, or blocks stored on a FAT32
#               file system" on a 64-bit setup with blocks on tmpfs) does not
#               apply. not-applicable: no product in the setup has any of the
#               advisory's packages (see [[product]]).
#   condition = "met" | "not-met" | "unknown"
#               The advisory's required conditions (database_specific.guard_dog,
#               every condition without required = false, service_running
#               included). Optional conditions are exposure factors and never
#               decide the result.
#   result    = "not-affected"       the version is out of range, or a required condition is not met
#               "affected"           the version is in range and every required condition is met
#               "possibly-affected"  anything else; `question` says what would settle it
# review = "max" marks a pair whose call was not clear-cut.
#
# [[setup.fact]]: the closed table of setup facts a matcher reads instead of
# prose (format: fixtures/README.md). Each row has name, service, subject,
# value and evidence.
#
# History:
# - 2026-11-17 (setup facts, X1): lab-old-synthetic x the LND DNS bootstrap
#   advisory changed from not-affected / not-met to affected / in-range / met
#   with review = "max". The advisory's required condition is option_disabled
#   nobootstrap, the lab does not set --nobootstrap, and the facts say so, so
#   the condition as written is met; "regtest has no DNS seeds" is not what the
#   condition says. Max decides whether the advisory should carry a chain
#   condition, which would make it not-affected. lab-regtest x the same
#   advisory stays not-affected (version out of range) but its condition is now
#   met, so the file follows its own facts. The test refuses any pair whose
#   condition differs from what its setup's facts say.

format = 1

