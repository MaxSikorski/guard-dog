# Setups.

[[setup]]
id = "lab-old-synthetic"
source = "synthetic"
platform = "docker"
chain = "regtest"
exposure = "none"
arch = "64-bit"
block_storage = "tmpfs"
description = "SYNTHETIC, not a recording: the regtest lab's exact configuration (no P2P peers, mines its own blocks, no tapd) with older, affected versions, so affected results are exercised before an old setup is recorded."
versions_from = "synthetic"

[[setup.service]]
id = "bitcoin-core"
version = "28.1"

[[setup.service]]
id = "core-lightning"
version = "25.09"

[[setup.service]]
id = "lnd"
version = "0.18.4-beta"

[[setup.service]]
id = "nutshell"
version = "0.17.0"

[[setup.fact]]
name = "p2p_inbound_or_outbound_peers"
service = "bitcoin-core"
value = "false"
evidence = "description: SYNTHETIC setup built from the regtest lab's exact configuration, which has no P2P peers; like the lab, bitcoind runs with -listen=0, -dnsseed=0, -fixedseeds=0 and no addnode or connect"

[[setup.fact]]
name = "node_builds_block_templates"
service = "bitcoin-core"
value = "true"
evidence = "description: SYNTHETIC setup built from the regtest lab's exact configuration, and the lab mines its own blocks with generatetoaddress"

[[setup.fact]]
name = "option_disabled"
service = "lnd"
subject = "nobootstrap"
value = "true"
evidence = "description: SYNTHETIC setup built from the regtest lab's exact configuration, and the lab does not set --nobootstrap for lnd (the expectation for the DNS bootstrap advisory stays unknown: see the header note)"

[[setup.fact]]
name = "option_enabled"
subject = "invoice HTLC interceptor (or any HtlcModifier RPC client)"
value = "false"
evidence = "description: SYNTHETIC setup built from the regtest lab's exact configuration, which has no tapd and no Lightning Terminal (the service tapd is not in this setup)"

[[setup]]
id = "lab-regtest"
source = "lab"
platform = "docker"
chain = "regtest"
exposure = "none"
arch = "64-bit"
block_storage = "tmpfs"
description = "Guard Dog's regtest lab: five 64-bit containers on one internal Docker network with no route out, no published ports and all data on tmpfs."
versions_from = "lab/compose.yml"
packages_from = "2026-11-16: docker run --rm --network=none of each pinned image digest (arm64 variant; amd64 not checked): xz --version, ls of liblzma files, dpkg-query -W or apk info -e."

[[setup.service]]
id = "bitcoin-core"
version = "32.1"

[[setup.service]]
id = "core-lightning"
version = "26.06.9"

[[setup.service]]
id = "lnd"
version = "0.21.6-beta"

[[setup.service]]
id = "nutshell"
version = "0.21.0"

[[setup.service]]
id = "strfry"
version = "1.1.2-148-g4cd3cf6"

[[setup.package]]
in = "bitcoin-core"
product = "xz-utils"
version = "5.4.1"
evidence = "Debian 12 image: liblzma.so.5.4.1; dpkg liblzma5 5.4.1-1+deb12u2; no xz binary"

[[setup.package]]
in = "core-lightning"
product = "xz-utils"
version = "5.4.1"
evidence = "Debian 12 image: liblzma.so.5.4.1; dpkg liblzma5 5.4.1-1+deb12u2; no xz binary"

[[setup.package]]
in = "lnd"
product = "xz-utils"
version = "none"
evidence = "Alpine 3.24 image: no xz, no liblzma file, apk has neither xz nor xz-libs"

[[setup.package]]
in = "nutshell"
product = "xz-utils"
version = "5.8.1"
evidence = "Debian 13 image: xz --version 5.8.1, liblzma.so.5.8.1; dpkg xz-utils and liblzma5 5.8.1-1+deb13u1"

[[setup.package]]
in = "strfry"
product = "xz-utils"
version = "none"
evidence = "Alpine 3.18 image: no xz, no liblzma file, apk has neither xz nor xz-libs"

[[setup.fact]]
name = "p2p_inbound_or_outbound_peers"
service = "bitcoin-core"
value = "false"
evidence = "lab/compose.yml: bitcoind runs with -listen=0, -dnsseed=0, -fixedseeds=0, no -connect or -addnode, and the lab network is internal with no published ports"

[[setup.fact]]
name = "node_builds_block_templates"
service = "bitcoin-core"
value = "true"
evidence = "the lab mines its own blocks with generatetoaddress (the existing expectation for CVE-2025-62861 states it); lab/compose.yml sets no -blocksonly"

[[setup.fact]]
name = "option_disabled"
service = "lnd"
subject = "nobootstrap"
value = "true"
evidence = "lab/compose.yml: the lnd command line has no --nobootstrap, so the option is not set"

[[setup.fact]]
name = "option_enabled"
subject = "invoice HTLC interceptor (or any HtlcModifier RPC client)"
value = "false"
evidence = "lab/compose.yml: no tapd or Lightning Terminal service is defined (the service tapd is not in this setup)"

