# Judge B: what a correct advisory matcher must say, for every recorded setup
# and every advisory in advisories/corpus/. Written by hand BEFORE any matcher
# exists. Never loosen an entry to make the matcher pass without a written
# reason in the PR and in this file's history.
#
# Format and rules: fixtures/README.md ("Expected advisory matches").
# Checked by crates/gd-core/tests/expected_matches.rs.
#
# Each [[expect]] judges the version and the conditions separately:
#   version   = "in-range" | "out-of-range" | "unknown" | "not-applicable"
#               (not-applicable: the product isn't in the setup at all)
#   condition = "met" | "not-met" | "unknown"
#               (the advisory's required database_specific conditions,
#               service_running included)
# and the result follows from the two:
#   not-affected      the version is out of range, or a required condition is not met
#   affected          the version is in range and every required condition is met
#   possibly-affected anything else; `question` says what would settle it
# review = "max" marks a pair where the call was not clear-cut.

format = 1

[[setup]]
id = "lab-regtest"
platform = "docker"
chain = "regtest"
exposure = "none"
description = "Guard Dog's regtest lab: five 64-bit containers on one internal Docker network with no route out, no published ports and all data on tmpfs."
versions_from = "lab/compose.yml"

[[setup.service]]
id = "bitcoin-core"
version = "32.1"

[[setup.service]]
id = "core-lightning"
version = "26.06.9"

[[setup.service]]
id = "lnd"
version = "0.21.6-beta"

[[setup.service]]
id = "nutshell"
version = "0.21.0"

[[setup.service]]
id = "strfry"
version = "1.1.2-148-g4cd3cf6"

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2024-3094"
result = "possibly-affected"
version = "unknown"
condition = "unknown"
reason = "Affected is xz 5.6.0 to 5.6.1 (package_installed xz-utils or liblzma, required); the lab records no package versions for its five images, so neither check can be done."
question = "Which xz-utils or liblzma version, if any, is installed in each of the five lab images?"
review = "max"

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2024-35202"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is not below the fix 25.0 (range 0 to fixed 25.0)."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2024-38359"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "LND 0.21.6-beta is not below the fix 0.17.0-beta (SEMVER range 0 to fixed 0.17.0-beta)."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2024-49379"
result = "not-affected"
version = "not-applicable"
condition = "not-met"
reason = "Required service_running umbrelos is not met: the lab runs no umbrelOS."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2024-52911"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is outside the range introduced 0.14.0 to fixed 29.0."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2024-52922"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is not below the fix 25.1 (range 0 to fixed 25.1)."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2025-46598"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is not below the fix 30.0 (range 0 to fixed 30.0)."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2025-62859"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is not below the fix 29.2 (range 0 to fixed 29.2; 30.0 also carries the fix)."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2025-62861"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is in neither range 28.0 to fixed 28.3 nor 29.0 to fixed 29.2. The lab does build block templates (generatetoaddress), so only the version clears it."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2026-117346"
result = "not-affected"
version = "in-range"
condition = "not-met"
reason = "32.1 is the fix on the 64-bit entry (32.0 to fixed 32.1), but it falls in the unfixed entry (0, no fix) that applies only to 32-bit systems or blocks on FAT32; the lab runs 64-bit images (amd64, arm64) with blocks on tmpfs, so that platform condition is not met."
review = "max"

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2026-117349"
result = "not-affected"
version = "out-of-range"
condition = "met"
reason = "Bitcoin Core 32.1 is exactly the fix of the 32 line (range 32.0 to fixed 32.1), so it is out of range."

[[expect]]
setup = "lab-regtest"
advisory = "CVE-2026-119757"
