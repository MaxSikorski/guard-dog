# Guard Dog's issue and pull request labels: the single list of truth.
#
# GitHub doesn't read this file by itself. A maintainer syncs it with `gh label`
# commands after changing it. Issue and discussion forms in this folder apply
# some of these labels automatically; a label that doesn't exist yet is
# skipped, so sync this file before relying on the forms.
#
# `rename_from` names a GitHub default label to rename (keeping the issues
# already tagged with it) instead of creating a new one.
#
# Colours are hex without the leading #.

# Type: what kind of issue this is. Every issue gets exactly one.
- name: "type: bug"
  color: "d73a4a"
  description: "Guard Dog does something wrong or breaks"
  rename_from: "bug"
- name: "type: false-alarm"
  color: "e99695"
  description: "Guard Dog reported an advisory that doesn't apply"
- name: "type: missed-advisory"
  color: "b60205"
  description: "Guard Dog stayed quiet about an advisory that applies"
- name: "type: feature"
  color: "a2eeef"
  description: "A new capability or a change in behaviour"
  rename_from: "enhancement"
- name: "type: docs"
  color: "0075ca"
  description: "README, guides, website text or code comments"
  rename_from: "documentation"
- name: "type: catalog"
  color: "1d76db"
  description: "Add or fix a service catalog entry (catalog/*.toml)"
- name: "type: advisory"
  color: "5319e7"
  description: "Add or fix a public advisory in the corpus"

# Area: which part of Guard Dog it touches. One or more.
- name: "area: core"
  color: "c5def5"
  description: "gd-core: the fact model, shared types and checks"
- name: "area: sensors"
  color: "c5def5"
  description: "Finding services and versions on a setup"
- name: "area: matcher"
  color: "c5def5"
  description: "Matching what you run against advisories"
- name: "area: catalog"
  color: "c5def5"
  description: "The service catalog format and its test"
- name: "area: notify"
  color: "c5def5"
  description: "Alerts: Nostr DM, ntfy, email"
- name: "area: lab"
  color: "c5def5"
  description: "The regtest lab (lab/)"
- name: "area: website"
  color: "c5def5"
  description: "The project website (docs/)"
- name: "area: judges"
  color: "c5def5"
  description: "Judges A to D and their fixtures"
- name: "area: install"
  color: "c5def5"
  description: "Installing and running Guard Dog, INSTALL-WITH-AI.md"

# Platform: where the reporter runs it. Zero or more.
- name: "platform: umbrel"
  color: "bfdadc"
  description: "umbrelOS"
- name: "platform: start9"
  color: "bfdadc"
  description: "StartOS"
- name: "platform: raspiblitz"
  color: "bfdadc"
  description: "RaspiBlitz"
- name: "platform: mynode"
  color: "bfdadc"
  description: "myNode"
- name: "platform: nix-bitcoin"
  color: "bfdadc"
  description: "nix-bitcoin"
- name: "platform: docker"
  color: "bfdadc"
  description: "Plain Docker or Docker Compose"
- name: "platform: bare-metal"
  color: "bfdadc"
  description: "Plain Linux, no node platform"

# Priority: set by a maintainer during triage.
- name: "priority: critical"
  color: "b60205"
  description: "Could put someone's funds or privacy at risk; drop other work"
- name: "priority: high"
  color: "d93f0b"
  description: "Next in line"
- name: "priority: medium"
  color: "fbca04"
  description: "Planned, not urgent"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# Status: where an issue stands.
- name: "status: needs-triage"
  color: "ededed"
  description: "New; a maintainer hasn't looked yet"
- name: "status: needs-repro"
  color: "f9d0c4"
  description: "We can't reproduce it yet; more details needed"
- name: "status: blocked"
  color: "000000"
  description: "Waiting on something outside this issue"
- name: "status: accepted"
  color: "0e8a16"
  description: "Triaged and wanted; open for a pull request"

# Contributor and review flags.
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-scoped and a good way in"
- name: "help wanted"
  color: "008672"
  description: "I'd love someone to pick this up"
- name: "security-sensitive-path"
  color: "b60205"
  description: "Touches CI, release, signing, privileges or the gate; needs the maintainer's review"

# GitHub defaults kept as they are.
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "A question; usually better in Discussions Q&A"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
