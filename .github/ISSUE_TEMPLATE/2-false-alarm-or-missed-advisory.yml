name: False alarm or missed advisory
description: Guard Dog flagged an advisory that doesn't apply to you, or stayed quiet about one that does.
title: "Advisory match: "
labels: ["area: matcher", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful report you can send. Every one of these becomes a test case for Judge B, the test that checks advisory matching, so the same mistake can't come back.

        **Only public advisories here.** If you know about a vulnerability that hasn't been made public, please tell that project's maintainers privately first. See [SECURITY.md](https://github.com/MaxSikorski/guard-dog/blob/main/SECURITY.md).
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you post
      options:
        - label: I removed seeds, nsecs, xpubs, macaroons, passwords, tokens, IP addresses, onion addresses and hostnames from everything below.
          required: true
        - label: The advisory is already public.
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: Which is it?
      options:
        - False alarm: Guard Dog flagged something that doesn't apply
        - Missed advisory: Guard Dog didn't flag something that applies
        - Not sure: it says "possibly affected" and I can't tell
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product
      description: The software involved, ideally its catalog id (the file name in `catalog/`).
      placeholder: "e.g. lnd, core-lightning, btcpay-server"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: The version you run
      description: Exactly as the software reports it, and how you read it.
      placeholder: "e.g. 0.18.3-beta, from `lncli version`"
    validations:
      required: true
  - type: input
    id: advisory-id
    attributes:
      label: Advisory id
      description: CVE, GHSA, OSV or the project's own id, plus a link to the primary source if you have one.
      placeholder: "e.g. CVE-2024-12345, GHSA-xxxx-xxxx-xxxx"
    validations:
      required: true
  - type: textarea
    id: guard-dog-said
    attributes:
      label: What Guard Dog said
      description: The alert or report line, redacted. "Nothing" is a valid answer for a missed advisory.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why you think it's wrong
      description: For example "the fix is in my version", "this only applies when the RPC port is public and mine isn't", or "the advisory lists my version as affected".
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where it runs
      options:
        - umbrelOS
        - StartOS
        - RaspiBlitz
        - myNode
        - nix-bitcoin
        - Plain Docker or Docker Compose
        - Plain Linux (bare metal or VM)
        - The regtest lab
        - Other
  - type: input
    id: guard-dog-version
    attributes:
      label: Guard Dog version or commit
      placeholder: "e.g. 0.1.0 or 8ff6ac6"
