# Nightly: everything the merge gate runs, plus the checks that are too slow
# or too noisy for every pull request. Also runnable by hand (Actions tab).
name: nightly

on:
  schedule:
    # Once a day, 04:17 UTC. An odd minute, because the top of the hour is busy.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One nightly run at a time; a manual run waits for a running one to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Everything in test.yml (fmt, clippy, test, test-aarch64, deny).
  gate:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # New RustSec advisories show up against an unchanged Cargo.lock. cargo-deny
  # reads the same RustSec database as cargo-audit, so cargo-audit is not
  # installed separately.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: "0.21.0"
      CARGO_DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-deny (checked download)
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "${RUNNER_TEMP}/cargo-deny"
          cd "${RUNNER_TEMP}/cargo-deny"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${name}.tar.gz" | sha256sum -c -
          tar -xzf "${name}.tar.gz"
          echo "${RUNNER_TEMP}/cargo-deny/${name}" >> "${GITHUB_PATH}"
      - name: cargo deny check advisories
        run: cargo deny check advisories

  # TODO(Phase 0.8): the lab judges go here once the regtest lab exists
  # (lab/up.sh, then the judges, then lab/down.sh). No placeholder job yet.

  # Reproducible builds: the same source built on two different runners should
  # give the same bytes. Each build reports the SHA-256 of the binary.
  build-repro-latest:
    name: build-repro-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: cargo build --release
        run: cargo build --locked --release
      - name: Hash the binary
        id: hash
        run: |
          set -euo pipefail
          sum="$(sha256sum target/release/guard-dog | cut -d' ' -f1)"
          echo "${sum}  target/release/guard-dog"
          echo "sha256=${sum}" >> "${GITHUB_OUTPUT}"

  build-repro-2204:
    name: build-repro-2204
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: cargo build --release
        run: cargo build --locked --release
      - name: Hash the binary
        id: hash
        run: |
          set -euo pipefail
          sum="$(sha256sum target/release/guard-dog | cut -d' ' -f1)"
          echo "${sum}  target/release/guard-dog"
          echo "sha256=${sum}" >> "${GITHUB_OUTPUT}"

  reproducible:
    name: reproducible
    needs: [build-repro-latest, build-repro-2204]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Expected to be RED until Phase 4.6 (reproducible builds). The result is
    # recorded on every run, but it must not block anything. Remove this line
    # when the two hashes start to match.
    continue-on-error: true
    env:
      SHA_LATEST: ${{ needs.build-repro-latest.outputs.sha256 }}
      SHA_2204: ${{ needs.build-repro-2204.outputs.sha256 }}
    steps:
      - name: Compare the two hashes
        run: |
          echo "ubuntu-latest: ${SHA_LATEST}"
          echo "ubuntu-22.04:  ${SHA_2204}"
          if [ -z "${SHA_LATEST}" ] || [ "${SHA_LATEST}" != "${SHA_2204}" ]; then
            echo "::error::The two builds differ (expected until Phase 4.6)."
            exit 1
          fi
          echo "The two builds are byte-identical."
