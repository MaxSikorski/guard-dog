# Nightly: everything the merge gate runs, plus the checks that are too slow
# or too noisy for every pull request. Also runnable by hand (Actions tab).
name: nightly

on:
  schedule:
    # Once a day, 04:17 UTC. An odd minute, because the top of the hour is busy.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Both reproducibility builds bake in the same commit id.
env:
  CARGO_INCREMENTAL: "0"
  GD_GIT_COMMIT: ${{ github.sha }}

# One nightly run at a time; a manual run waits for a running one to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Everything in test.yml (fmt, clippy, test, test-aarch64, deny).
  gate:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # There is no separate advisories job: `gate / deny` above runs the full
  # `cargo deny --locked check`, which includes the RustSec advisory check, so
  # new advisories against an unchanged Cargo.lock still turn the nightly red.

  # The regtest lab (Phase 0.8): start it cold on a clean runner, prove a funded
  # LND <-> Core Lightning channel, record the versions each service reports,
  # then remove everything. amd64 here; Max's Mac covers arm64.
  # - Nothing from lab/.data is uploaded: it holds generated credentials.
  # - The lab's network needs Docker 28 or later (`gateway_mode_ipv4: isolated`).
  #   If the runner's Docker is older, this job fails on purpose; the option
  #   stays, so isolation is never quietly weakened.
  lab:
    name: lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the Docker version and the time; require Docker 28 or later
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          docker version
          docker compose version
          major="$(docker version --format '{{.Server.Version}}' | cut -d. -f1)"
          case "${major}" in
            ''|*[!0-9]*) echo "::error::Could not read the Docker server version."; exit 1 ;;
          esac
          if [ "${major}" -lt 28 ]; then
            echo "::error::Docker ${major} is too old: the lab's isolated network needs Docker 28 or later. Not weakening isolation; fix the runner."
            exit 1
          fi
      - name: Start the lab cold, fund and open a channel (5 minute limit)
        run: |
          set -euo pipefail
          start="$(date +%s)"
          GD_LAB_MAX_SECONDS=300 lab/up.sh
          elapsed=$(( $(date +%s) - start ))
          echo "lab/up.sh took ${elapsed}s (limit 300s)"
          echo "lab/up.sh took ${elapsed}s" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${elapsed}" -gt 300 ]; then
            echo "::error::lab/up.sh took ${elapsed}s, over the 300s limit."
            exit 1
          fi
      - name: Record the lab's manifest (versions only, no secrets)
        if: always()
        run: |
          {
            echo "### Regtest lab"
            echo ""
            echo '```toml'
            cat lab/.data/manifest.toml 2>/dev/null || echo "(no manifest: lab/up.sh failed before writing it)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove the lab
        if: always()
        run: lab/down.sh

  # Reproducible builds: the same source built on two different runners should
  # give the same bytes. Each build reports the SHA-256 of the binary.
  build-repro-2404:
    name: build-repro-2404
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: cargo build --release
        run: cargo build --locked --release
      - name: Hash the binary
        id: hash
        run: |
          set -euo pipefail
          sum="$(sha256sum target/release/guard-dog | cut -d' ' -f1)"
          echo "${sum}  target/release/guard-dog"
          echo "sha256=${sum}" >> "${GITHUB_OUTPUT}"

  build-repro-2204:
    name: build-repro-2204
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - name: cargo build --release
        run: cargo build --locked --release
      - name: Hash the binary
        id: hash
        run: |
          set -euo pipefail
          sum="$(sha256sum target/release/guard-dog | cut -d' ' -f1)"
          echo "${sum}  target/release/guard-dog"
          echo "sha256=${sum}" >> "${GITHUB_OUTPUT}"

  reproducible:
    name: reproducible
    needs: [build-repro-2404, build-repro-2204]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Expected to be RED until Phase 4.6 (reproducible builds). The result is
    # recorded on every run, but it must not block anything. Remove this line
    # when the two hashes start to match.
    continue-on-error: true
    env:
      SHA_2404: ${{ needs.build-repro-2404.outputs.sha256 }}
      SHA_2204: ${{ needs.build-repro-2204.outputs.sha256 }}
    steps:
      - name: Compare the two hashes
        run: |
          echo "ubuntu-24.04: ${SHA_2404}"
          echo "ubuntu-22.04:  ${SHA_2204}"
          if [ -z "${SHA_2404}" ] || [ "${SHA_2404}" != "${SHA_2204}" ]; then
            verdict="DIFFERENT (expected until Phase 4.6)"
          else
            verdict="byte-identical"
          fi
          {
            echo "### Reproducibility"
            echo ""
            echo "| Runner | SHA-256 of target/release/guard-dog |"
            echo "|---|---|"
            echo "| ubuntu-24.04 | \`${SHA_2404}\` |"
            echo "| ubuntu-22.04 | \`${SHA_2204}\` |"
            echo ""
            echo "Verdict: ${verdict}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${verdict}" != "byte-identical" ]; then
            echo "::error::The two builds differ (expected until Phase 4.6)."
            exit 1
          fi
          echo "The two builds are byte-identical."

  # Failure notice: if the scheduled nightly fails, open one GitHub issue
  # ("Nightly failures") with the run link, or comment on the open one, so a
  # red nightly is never missed.
  #
  # - `reproducible` is left out of `needs` on purpose: it is expected red
  #   until Phase 4.6, and this job only looks at the jobs listed here. A
  #   broken release build still counts, because both build-repro jobs are
  #   listed. Add `reproducible` here in Phase 4.6.
  # - A job that hits its timeout ends as `cancelled`, not `failure`, so both
  #   count. If someone cancels the whole run by hand, `!cancelled()` is false
  #   and no notice is sent: they already know.
  # - Scheduled runs on this repository only. A manual run has someone
  #   watching it and can run from any branch; forks must not file issues.
  # - Only this job can write issues. No checkout, no third-party actions:
  #   just the `gh` that comes on the runner. Every value reaches the shell
  #   through env, and only fixed values (job results, run id, commit id)
  #   are used. No commit message, branch name or PR title is ever read.
  # - Any gh error turns this job red, so a broken notice is visible too.
  notify-failure:
    name: notify-failure
    needs: [gate, lab, build-repro-2404, build-repro-2204]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'MaxSikorski/guard-dog' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the nightly-failure issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_SHA: ${{ github.sha }}
      RESULT_GATE: ${{ needs.gate.result }}
      RESULT_LAB: ${{ needs.lab.result }}
      RESULT_REPRO_2404: ${{ needs.build-repro-2404.result }}
      RESULT_REPRO_2204: ${{ needs.build-repro-2204.result }}
    steps:
      - name: Open or update the nightly failure issue
        run: |
          set -euo pipefail
          label="nightly-failure"
          today="$(date -u +%Y-%m-%d)"

          failed=""
          for pair in "gate=${RESULT_GATE}" \
                      "lab=${RESULT_LAB}" \
                      "build-repro-2404=${RESULT_REPRO_2404}" \
                      "build-repro-2204=${RESULT_REPRO_2204}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "${result}" != "success" ]; then
              failed="${failed}- ${name}: ${result}"$'\n'
            fi
          done

          body="The scheduled nightly failed on ${today}.

          Run: ${RUN_URL}
          Commit: ${COMMIT_SHA}

          Jobs that did not pass:
          ${failed}
          (The reproducible job is not counted: it is expected to fail until Phase 4.6.)"

          # Create the label, or update it if it already exists.
          gh label create "${label}" --force --color B60205 \
            --description "The scheduled nightly run failed"

          # Read open issues straight from the REST API (not search, which can
          # lag behind). Pull requests share this list, so drop them.
          open_issues="$(gh api --paginate \
            "repos/${GH_REPO}/issues?state=open&labels=${label}&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .number')"
          existing="$(printf '%s\n' "${open_issues}" | head -n 1)"

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Commented on issue #${existing}."
          else
            gh issue create --title "Nightly failures" --label "${label}" --body "${body}"
            echo "Opened a new issue."
          fi
