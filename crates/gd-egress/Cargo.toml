[package]
name = "gd-egress"
description = "Judge C: canary generator and egress-capture checker. Test tooling; never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "gd_egress"
path = "src/lib.rs"

[[bin]]
name = "gd-egress"
path = "src/main.rs"

[dependencies]
gd-core = { path = "../gd-core" }
clap.workspace = true
serde_json.workspace = true
toml = { workspace = true }
regex.workspace = true
sha2 = "=0.11.1"
sha3 = "=0.12.0"
# Request bodies are decoded before they are scanned (Judge C 1b). Pure Rust (miniz_oxide), no C code.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "=6.2.0"

[dev-dependencies]
proptest.workspace = true
# The tests' own, independent encoder: our hand-written ones are checked against it.
data-encoding = "=2.11.1"
