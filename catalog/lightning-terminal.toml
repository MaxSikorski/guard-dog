# Lightning Terminal. Format: catalog/README.md. Checked by crates/gd-core/tests/catalog.rs.
format = 1
id = "lightning-terminal"
name = "Lightning Terminal"
kind = "service"
aliases = []
summary = "Lightning Labs' node package: it bundles LND and Taproot Assets in one release."
money = true
licence = "unknown"
bundles = ["lnd", "tapd"]

[upstream]
repo = "https://github.com/lightninglabs/lightning-terminal"

[recognize]
images = []
binaries = []
units = []

[version]
source = "image-label"
credential = "none"
regex = '^(?P<version>\d+\.\d+\.\d+-alpha)$'
scheme = "semver-beta"

[version.call]
field = "org.opencontainers.image.version"

[[version.examples]]
raw = "0.15.0-alpha"
version = "0.15.0-alpha"
source = "advisories/corpus/x_lightning-labs-2026-lnd-tapd-cancelled-htlc-marked-settled.json"
source_kind = "advisory"

[advisories]
osv_packages = ["Go github.com/lightninglabs/lightning-terminal"]
ghsa = false
feeds = []
blind_spot = "The repo corpus holds one advisory for it, from Lightning Labs' advisory site. Whether the project has GitHub advisories has not been checked; the site's Atom feed cannot be named here until a reviewed URL exception covers it."

[signing]
level = "unknown"

[review]
last_reviewed = 2026-11-17
sources = [
  "https://security.lightning.engineering/2026/09/21/lnd-tapd-cancelled-htlc-marked-settled.html",
]
todo = [
  "licence: read the upstream LICENSE file",
  "summary: from the advisory (0.15.0-alpha is the first release bundling lnd and tapd); confirm the project's own one-liner",
  "upstream.repo: inferred from the Go module path in Judge B's package name; confirm it is canonical",
  "upstream.website, upstream.release_feed, upstream.security_policy: none recorded in the repo",
  "images: no image name is recorded; add it with a recorded reply (the version source assumes a container image)",
  "binaries: no executable name is recorded",
  "units: no systemd unit name is recorded",
  "ports: no port is named in the repo",
  "recorded-reply: 0.15.0-alpha is the advisory's first fixed release, not a recorded reply; record a real label value",
  "scheme: semver-beta is the closest scheme but the suffix is alpha; confirm the ordering rule against the version-logic design",
  "bundles: taken from the advisory; confirm it still holds for later releases",
  "advisories.feeds: the Lightning Labs feed exists but the reviewed URL exception lists it for lnd only",
  "advisories.ghsa: unverified; check the project's Security tab",
  "signing: level, method and keys are not recorded",
  "platform_map: app ids on UmbrelOS, StartOS, RaspiBlitz and myNode",
]
