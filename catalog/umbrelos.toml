# umbrelOS. Format: catalog/README.md. Checked by crates/gd-core/tests/catalog.rs.
format = 1
id = "umbrelos"
name = "umbrelOS"
kind = "platform"
aliases = []
summary = "The operating system that runs an Umbrel home server, with a web login page."
money = true
licence = "unknown"

[upstream]
repo = "https://github.com/getumbrel/umbrel"

[recognize]
images = []
binaries = []
units = []

[version]
source = "platform-manifest"
credential = "none"
regex = '^(?P<version>1\.\d+\.\d+)$'
scheme = "semver"

[version.call]
field = "version"

[[version.examples]]
raw = "1.2.2"
version = "1.2.2"
source = "advisories/corpus/CVE-2024-49379.json"
source_kind = "advisory"

[advisories]
osv_packages = ["GIT https://github.com/getumbrel/umbrel"]
ghsa = false
feeds = []
blind_spot = "The repo corpus holds one advisory for it, a GitHub Security Lab write-up with a CVE. Whether the project has GitHub advisories or a feed a machine can read has not been checked."

[signing]
level = "unknown"

[review]
last_reviewed = 2026-11-17
sources = [
  "https://github.com/getumbrel/umbrel/releases/tag/1.2.2",
  "https://securitylab.github.com/advisories/GHSL-2024-164_Umbrel/",
]
todo = [
  "licence: read the upstream LICENSE file; do not assume it matches the other entries",
  "summary: from the advisory (the login page, the Umbrel device, Settings); confirm the project's own one-liner",
  "money: true because umbrelOS hosts the apps that hold the keys. Its advisory is a login-link attack that can run commands on the device",
  "upstream.website, upstream.release_feed, upstream.security_policy: none recorded in the repo",
  "images: umbrelOS ships as an OS image, not an OCI image; confirm no pattern applies",
  "binaries: an operating system has no single executable Guard Dog can call",
  "units: no systemd unit name is recorded",
  "ports: no port is named in the repo",
  "version: platform-manifest has no definition in the repo; the version is read by the platform adapter (Phase 1.3); no manifest or recording exists yet",
  "recorded-reply: 1.2.2 is the CVE's fixed version, not a recorded reply",
  "version.regex: pinned to the 1.x series the advisory shows (a bare x.y.z pattern is refused); older releases are not read; widen it when a real manifest is recorded",
  "advisories.ghsa: unverified; check the project's Security tab",
  "signing: level, method and keys are not recorded",
]
