# Taproot Assets daemon. Format: catalog/README.md. Checked by crates/gd-core/tests/catalog.rs.
format = 1
id = "tapd"
name = "Taproot Assets daemon (tapd)"
kind = "service"
aliases = []
summary = "The Taproot Assets daemon, which carries assets over Lightning channels."
money = true
licence = "unknown"

[upstream]
repo = "https://github.com/lightninglabs/taproot-assets"

[recognize]
images = []
binaries = ["tapd"]
units = []

[version]
source = "image-label"
credential = "none"
regex = '^(?P<version>0\.\d+\.\d+)$'
scheme = "semver"

[version.call]
field = "org.opencontainers.image.version"

[[version.examples]]
raw = "0.5.1"
version = "0.5.1"
source = "advisories/corpus/x_lightning-labs-2026-lnd-tapd-cancelled-htlc-marked-settled.json"
source_kind = "advisory"

[advisories]
osv_packages = ["Go github.com/lightninglabs/taproot-assets"]
ghsa = false
feeds = []
blind_spot = "The repo corpus holds one advisory for it, from Lightning Labs' advisory site. Whether the project has GitHub advisories has not been checked; the site's Atom feed cannot be named here until a reviewed URL exception covers it."

[signing]
level = "unknown"

[review]
last_reviewed = 2026-11-17
sources = [
  "https://security.lightning.engineering/2026/09/21/lnd-tapd-cancelled-htlc-marked-settled.html",
]
todo = [
  "licence: read the upstream LICENSE file",
  "summary: from the advisory (asset payments, custom wire records, the invoice HTLC interceptor); confirm the project's own one-liner",
  "upstream.repo: inferred from the Go module path in Judge B's package name; confirm it is canonical",
  "upstream.website, upstream.release_feed, upstream.security_policy: none recorded in the repo",
  "images: no image name is recorded; add it with a recorded reply (the version source assumes a container image)",
  "binaries: tapd is the name the advisory uses; confirm the installed executable name",
  "units: no systemd unit name is recorded",
  "version: a host-installed binary has no image label; reading its version there needs a cli source (and a reviewed read-only call) later",
  "ports: no port is named in the repo",
  "recorded-reply: 0.5.1 is the advisory's fixed version, not a recorded reply; record a real label value (tapd may print an -alpha suffix, which this pattern would not read)",
  "version.regex: pinned to the 0.x series the advisory shows (a bare x.y.z pattern is refused); older releases are not read; widen it when a real label is recorded",
  "advisories.feeds: the Lightning Labs feed exists but the reviewed URL exception lists it for lnd only",
  "advisories.ghsa: unverified; check the project's Security tab",
  "signing: level, method and keys are not recorded",
  "platform_map: app ids on UmbrelOS, StartOS, RaspiBlitz and myNode",
]
