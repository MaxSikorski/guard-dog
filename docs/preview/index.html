<style>
/* Sikorski Design System tokens: pure black and white chrome, glass cards, Inter.
   Colour is used ONLY for meaning: urgency (red, orange, yellow, blue, green)
   and categories (Bitcoin orange, Lightning amber, Nostr purple, Cashu pink). Dark is the default. */
:root{
  --bg:#000000; --surface:rgba(28,28,30,.7); --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.1);
  --text:#ffffff; --muted:rgba(255,255,255,.6); --faint:rgba(255,255,255,.4); --border:rgba(255,255,255,.1);
  --accent:#ffffff; --accent-ink:#000000; --accent-soft:rgba(255,255,255,.1);
  --crit:#ff453a; --crit-soft:rgba(255,69,58,.16);
  --high:#ff9f0a; --high-soft:rgba(255,159,10,.16);
  --med:#ffd60a; --med-soft:rgba(255,214,10,.14);
  --low:#64d2ff; --low-soft:rgba(100,210,255,.14);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.15);
  --btc:#f7931a; --ln:#ffb340; --nostr:#bf5af2; --nostr-soft:rgba(191,90,242,.16); --cashu:#ff375f;
  --shadow:none; --blur:blur(30px); --glass-bg:rgba(0,0,0,.72); --top-h:64px;
  --radius:20px; --radius-sm:12px;
  --mono:"SF Mono",Consolas,"Liberation Mono",Menlo,Courier,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="light"]{
  --glass-bg:rgba(245,245,247,.78);
  --bg:#f5f5f7; --surface:rgba(255,255,255,.7); --surface-2:rgba(0,0,0,.04); --surface-3:rgba(0,0,0,.07);
  --text:#000000; --muted:rgba(0,0,0,.6); --faint:rgba(0,0,0,.42); --border:rgba(0,0,0,.1);
  --accent:#000000; --accent-ink:#ffffff; --accent-soft:rgba(0,0,0,.06);
  --crit:#d70015; --crit-soft:rgba(255,59,48,.12);
  --high:#c93400; --high-soft:rgba(255,149,0,.14);
  --med:#a05a00; --med-soft:rgba(255,204,0,.2);
  --low:#0071a4; --low-soft:rgba(90,200,250,.16);
  --ok:#248a3d; --ok-soft:rgba(52,199,89,.14);
  --btc:#d9730a; --ln:#c96a00; --nostr:#8944ab; --nostr-soft:rgba(175,82,222,.12); --cashu:#d30f45;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{transition:background-color .5s ease,color .5s ease}
h1,h2,h3{letter-spacing:-0.04em}
body{min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---------- top bar ---------- */
/* Fixed, always-frosted header: content scrolls behind glass, never into the words. */
.top{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:16px;padding:0 28px;background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);white-space:nowrap}
.top > *{flex-shrink:0}
@media (max-width:1180px){.top .hide-lg{display:none}}
@media (max-width:980px){.top .hide-md{display:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;font-size:16px;text-decoration:none}
.brand svg{width:26px;height:26px}
.node{display:flex;flex-direction:column;line-height:1.25;gap:2px;margin-left:4px;padding-left:16px;border-left:1px solid var(--border)}
.node b{font-size:13px} .node span{font-size:12px;color:var(--muted)}
.sample{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.top .grow{flex:1 1 auto;min-width:8px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:9px 18px;border-radius:30px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.88;background:var(--accent)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:30px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:38px;height:38px;justify-content:center;padding:0}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - var(--top-h))}
.side{border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:550;font-size:14px}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--surface-3);color:var(--text)}
.nav .count{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--crit);color:#fff}
.nav .count.soft{background:var(--surface-3);color:var(--muted)}
.nav .tag{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.side h6{margin:14px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--faint)}
main{padding:22px 26px 90px;max-width:1180px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{margin:0;font-size:26px;letter-spacing:-.02em}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.pagehead .grow{flex:1}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card h2{margin:0 0 10px;font-size:15px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
.card h2 svg{width:18px;height:18px;color:var(--muted)}
.card.flat{box-shadow:none}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:22px 24px;border-color:var(--crit);background:linear-gradient(var(--crit-soft),var(--crit-soft)),var(--surface)}
.hero .shield{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--crit-soft);color:var(--crit)}
.hero .shield svg{width:36px;height:36px}
.hero h2{font-size:22px;margin:0 0 4px}
.hero p{margin:0;color:var(--muted)}
.disclaimer{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px}
.disclaimer svg{width:18px;height:18px;flex:none;margin-top:1px}

/* ---------- chips / severity ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;text-transform:capitalize}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.critical{color:var(--crit);background:var(--crit-soft)}
.chip.high{color:var(--high);background:var(--high-soft)}
.chip.medium{color:var(--med);background:var(--med-soft)}
.chip.low{color:var(--low);background:var(--low-soft)}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.info{color:var(--muted);background:var(--surface-3)}
.chip.nostr{color:var(--nostr);background:var(--nostr-soft)}
.chip.plain::before{display:none}
.chip.possibly{color:var(--med);background:var(--med-soft)}
.pill{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted);white-space:nowrap}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.row.click{cursor:pointer;border-radius:10px;padding-left:10px;padding-right:10px;margin:0 -6px}
.row.click:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%}
.dot.critical{background:var(--crit)} .dot.high{background:var(--high)} .dot.medium{background:var(--med)} .dot.low{background:var(--low)} .dot.ok{background:var(--ok)} .dot.info{background:var(--faint)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.group-title{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.group-title:first-child{margin-top:0}
.group-title svg{width:16px;height:16px}

/* ---------- finding detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.steps li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.steps li.done span{color:var(--muted);text-decoration:line-through}
.evidence{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.evidence li{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:7px 10px;border-radius:8px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.question{border:1px dashed var(--med);background:var(--med-soft);border-radius:var(--radius-sm);padding:12px 14px}
.question p{margin:0 0 10px;font-weight:650}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- filters / tabs ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- forms ---------- */
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=url],input[type=password],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:disabled + span{opacity:.6;cursor:not-allowed}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.setting:first-of-type{border-top:0}
.setting .t{font-weight:600} .setting .s{font-size:13px;color:var(--muted)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form input{flex:1;min-width:220px}
.option-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.option-card{border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface);text-align:left}
.option-card[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.option-card b{display:block;margin-bottom:2px}
.option-card span{font-size:13px;color:var(--muted)}

/* ---------- exposure radar / scout map ---------- */
.radar{position:relative;aspect-ratio:1;max-width:260px;margin:0 auto}
.radar svg{width:100%;height:100%}
.mapwrap{position:relative;background:radial-gradient(circle at 50% 50%,var(--surface-2),var(--surface) 70%);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.mapnode{cursor:pointer}
.mapnode text{font-size:11px;fill:var(--muted);font-family:var(--sans)}
.mapnode circle.body{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
.mapnode:hover circle.body,.mapnode.sel circle.body{stroke:var(--accent);stroke-width:2.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--border)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---------- timeline ---------- */
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--faint)}
.timeline li.warn::before{border-color:var(--high)}
.timeline li.ok::before{border-color:var(--ok)}
.timeline time{display:block;font-size:12px;color:var(--faint)}

/* ---------- modal / drawer / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:28px;max-width:620px;width:100%;max-height:min(88vh,860px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:transparent;z-index:1}
.modal header h3{margin:0;font-size:17px;flex:1}
.modal .body{padding:18px 20px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:transparent}
.dm{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:14px;border:1px solid var(--border)}
.dmhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.avatar svg{width:22px;height:22px}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:11px;font-size:14px;box-shadow:var(--shadow);max-width:360px;animation:fadeUp .25s ease-out}
.wizard-steps{display:flex;gap:6px;margin-bottom:16px}
.wizard-steps i{height:5px;flex:1;border-radius:99px;background:var(--surface-3)}
.wizard-steps i.on{background:var(--accent)}
.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.scanlog{list-style:none;margin:12px 0 0;padding:0;font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:4px;min-height:120px}
.scanlog li{color:var(--muted)} .scanlog li b{color:var(--ok);font-weight:600}
.promise{display:grid;grid-template-columns:22px 1fr;gap:8px;margin:8px 0}
.promise svg{width:20px;height:20px;color:var(--ok)}

/* ---------- animation fallback ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.no-gsap .card{animation:fadeUp .35s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width: 1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail{grid-template-columns:1fr}
}
/* Phone menu: the same dropdown as the website and the weekly decks. The sidebar folds behind the menu
   button into one vertical list that scrolls on its own, so every page is a tap away. */
.nav-menu-toggle,.nav-menu{display:none}
.nav-menu-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:1rem;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.nav-menu-link svg{width:19px;height:19px;flex:none;color:var(--muted)}
.nav-menu-link:hover,.nav-menu-link:focus-visible{background:var(--surface-2)}
.nav-menu-link[aria-current="page"]{background:var(--surface-3)}
.nav-menu-link[aria-current="page"] svg{color:var(--text)}
.nav-menu .count{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--crit);color:#fff}
.nav-menu .count.soft{background:var(--surface-3);color:var(--muted)}
.nav-menu .tag{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.nav-menu h6{margin:12px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.nav-menu .menu-foot{margin:6px 0 0;padding:10px 14px 6px;border-top:1px solid var(--border);font-size:12.5px;color:var(--faint);white-space:normal}
@media (max-width: 860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .nav-menu-toggle{display:inline-flex}
  .nav-menu:not([hidden]){
    display:flex;flex-direction:column;
    position:absolute;top:calc(100% + 8px);right:16px;
    width:min(300px,calc(100vw - 32px));
    max-height:calc(100vh - var(--top-h) - 24px);max-height:calc(100dvh - var(--top-h) - 24px);
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:16px;
    box-shadow:0 12px 32px rgba(0,0,0,.25)
  }
  main{padding:16px 16px 90px}
  .g2,.g3{grid-template-columns:1fr}
  .hero{grid-template-columns:auto 1fr}
  .hero .btnrow{grid-column:1/-1}
  .option-cards{grid-template-columns:1fr}
}
@media (max-width: 520px){
  .g4{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row > :last-child{grid-column:2}
  .pagehead h1{font-size:22px}
  .top{padding:0 16px;gap:10px}
}
@media (max-width: 420px){
  #scanNow span{display:none}
  #scanNow{padding:9px 12px}
}

const SEV = { critical: 0, high: 1, medium: 2, low: 3 };
const sevLabel = { critical: "Critical", high: "High", medium: "Medium", low: "Low", ok: "OK", info: "Info", possibly: "Possibly affected" };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hasGsap = () => typeof window.gsap !== "undefined" && !reduced;
const open = () => D.findings.filter(f => f.status !== "resolved");
const chip = (sev, text) => `<span class="chip ${esc(sev)}">${esc(text || sevLabel[sev] || sev)}</span>`;

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 320); }, 3200);
}

function renderNav(current) {
  const items = (cls) => PAGES.map(p => {
    if (p.section) return `<h6>${esc(p.section)}</h6>`;
    const c = p.count ? p.count() : 0, s = p.soft ? p.soft() : 0;
    const badge = c ? `<span class="count">${c}</span>` : s ? `<span class="count soft">${s}</span>` : p.tag ? `<span class="tag">${esc(p.tag)}</span>` : "";
    return `<a ${cls ? `class="${cls}" ` : ""}href="#/${p.id}" ${p.id === current ? 'aria-current="page"' : ""}>${icon(p.icon)}<span>${esc(p.label)}</span>${badge}</a>`;
  }).join("");
  $("#nav").innerHTML = items("");
  $("#nav-menu").innerHTML = items("nav-menu-link") +
    `<div class="menu-foot"><b>Mock-up of planned software</b> with made-up data. <a href="#" id="startWizardMenu">Replay first-time setup</a><br><a href="../">← Guard Dog website</a><br><a href="../#support">Support Guard Dog</a> · <a href="../#contribute">Help build it</a></div>`;
}

/* Phone dropdown menu (same behaviour as the website's) */
const hamburgerPath = "M4 6h16M4 12h16M4 18h16", closePath = "M6 6l12 12M6 18L18 6";
function setMenu(open) {
  const menu = $("#nav-menu"), btn = $("#nav-menu-toggle");
  if (!menu || menu.hidden === !open) return;
  menu.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
  $("#menu-icon-path").setAttribute("d", open ? closePath : hamburgerPath);
  if (open) {
    const cur = menu.querySelector('[aria-current="page"]');
    menu.scrollTop = 0;
    if (cur) cur.scrollIntoView({ block: "nearest" });
    if (hasGsap()) gsap.fromTo(menu, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" });
  }
}

  const parts = (location.hash.replace(/^#\/?/, "") || "overview").split("/");
  const page = parts[0], arg = parts[1] ? decodeURIComponent(parts[1]) : null;

  const fn = VIEWS[page] || VIEWS.overview;
  $("#main").innerHTML = mockBanner() + fn(arg);
  after(page, arg);
  animateIn();
  $("#main").focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function animateIn() {
  if (hasGsap()) {
    gsap.from("#main .card", { y: 20, opacity: 0, duration: .8, stagger: .05, ease: "power4.out", clearProps: "transform,opacity" });
  }
}

let findingFilter = "open";
VIEWS.findings = (id) => {

function mapSVG() {
  const W = 560, H = 380, cx = W / 2, cy = H / 2;
  const others = D.devices.filter(d => d.kind !== "router");
  const nodes = others.map((d, i) => {
    const a = (i / others.length) * Math.PI * 2 - Math.PI / 2;
    const r = d.kind === "node" || d.kind === "btc" ? 120 : 155;
    return { d, x: cx + Math.cos(a) * r * 1.25, y: cy + Math.sin(a) * r * .82 };
  });
  const color = (d) => d.kind === "node" || d.kind === "btc" ? "var(--btc)" : d.known ? "var(--ok)" : "var(--high)";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of devices on your network">
    ${nodes.map(n => `<line class="edge" x1="${cx}" y1="${cy}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="var(--border)" stroke-width="1.5" ${n.d.known ? "" : 'stroke-dasharray="4 4"'}/>`).join("")}
    <g class="mapnode" data-dev="192.0.2.1" transform="translate(${cx},${cy})"><circle class="body" r="26"/><circle r="8" fill="var(--faint)"/><text y="44" text-anchor="middle">Router</text></g>
    ${nodes.map(n => `<g class="mapnode ${n.d.ip === selDevice ? "sel" : ""}" data-dev="${esc(n.d.ip)}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(n.d.name)}">
      ${!n.d.known ? `<circle class="pulse" r="20" fill="${color(n.d)}" opacity=".18"/>` : ""}
      <circle class="body" r="17"/><circle r="6.5" fill="${color(n.d)}"/>
      <text y="33" text-anchor="middle">${esc(n.d.name.length > 18 ? n.d.name.slice(0, 17) + "…" : n.d.name)}</text></g>`).join("")}
  </svg>`;
}

/* ======================================================================
   After-render hooks (animations and page-specific wiring)
   ====================================================================== */
function after(page) {
  if (page === "overview" && hasGsap()) {
    $$("[data-count]").forEach(el => {
      const n = +el.dataset.count, o = { v: 0 };
      gsap.to(o, { v: n, duration: .8, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(o.v); } });
    });
  }
  if (page === "exposure") {
    const arm = $("#sweepArm");
    if (hasGsap()) {
      gsap.to(arm, { rotation: -360, svgOrigin: "100 100", duration: 4, repeat: -1, ease: "none" });
      gsap.to(".blip", { scale: 1.25, svgOrigin: "148 62", duration: .9, yoyo: true, repeat: -1, ease: "sine.inOut" });
    } else if (arm && !reduced) {
      arm.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-360deg)" }], { duration: 4000, iterations: Infinity });
    }
  }
  if (page === "scout" && hasGsap()) {
    gsap.from(".mapnode", { scale: 0, transformOrigin: "50% 50%", duration: .5, stagger: .05, ease: "back.out(2)" });
    gsap.from(".edge", { opacity: 0, duration: .6, stagger: .04 });
    gsap.to(".pulse", { scale: 1.6, opacity: 0, transformOrigin: "50% 50%", duration: 1.4, repeat: -1, ease: "power1.out" });
  }
  if (page === "approvals") {
    clearInterval(window._expTimer);
    window._expTimer = setInterval(() => {
      D.approvals.forEach(a => { if (a.expires > 1) a.expires--; });
      $$(".exp").forEach((el, i) => { if (D.approvals[i]) el.textContent = D.approvals[i].expires; });
    }, 60000);
  }
}

  const log = $("#scanLog"), bar = $("#scanBar");
  clearInterval(window._scanTimer);
  if (hasGsap()) gsap.to(bar, { width: "100%", duration: lines.length * .32, ease: "power1.inOut" });
  else bar.style.cssText = `width:100%;transition:width ${lines.length * .32}s ease`;
  window._scanTimer = setInterval(() => {
    if (!log || i >= lines.length) { clearInterval(window._scanTimer); const b = $("#wzResults"); if (b) { b.disabled = false; b.focus(); } return; }
    const li = document.createElement("li"); li.innerHTML = `<b>✓</b> ${esc(lines[i++])}`;
    log.appendChild(li);
    if (hasGsap()) gsap.from(li, { x: -8, opacity: 0, duration: .25 });
  }, 320);
}

/* ======================================================================
   Events (one delegated listener)
   ====================================================================== */
document.addEventListener("click", (e) => {
  const menu = $("#nav-menu");
  if (menu && !menu.hidden && !e.target.closest("#nav-menu, #nav-menu-toggle")) setMenu(false);
  const t = e.target.closest("button, a, g.mapnode, tr[data-dev]");
  if (!t) return;
  const ds = t.dataset;
  if (t.id === "nav-menu-toggle") { setMenu(menu.hidden); return; }
  if (t.closest("#nav-menu")) setMenu(false);

  if (ds.close !== undefined) { closeModal(); return; }
  if (ds.filter) { findingFilter = ds.filter; route(); return; }
  if (ds.stab) { settingsTab = ds.stab; route(); return; }
  if (ds.ai) { D.settings.ai = ds.ai; route(); return; }
  if (ds.skinPick) { applySkin(ds.skinPick); toast(`Theme: ${SKINS.find(s => s.id === ds.skinPick).name}`); route(); return; }
  if (ds.dev) { selDevice = ds.dev; route(); return; }
  if (ds.wz !== undefined) { wizard(+ds.wz); return; }

  if (ds.answer !== undefined) {
    const f = D.findings.find(x => x.id === ds.id); const a = +ds.answer;
    if (f.id === "GD-SAMPLE-0002") {
      if (a === 0) { f.status = "affected"; f.sev = "critical"; toast("Affected. Follow the steps: new seed with dice, then move funds."); }
      else { f.status = "resolved"; f.when = "resolved just now"; toast("Not affected: this seed doesn't rest on the device's weak randomness alone."); }
    } else if (f.id === "GD-SAMPLE-0004") {
      if (a === 0) { f.status = "affected"; toast("Thanks. It stays open until it's updated or retired."); }
      else { f.status = "affected"; f.sev = "high"; toast("Treated as unknown: block it on your router, then look into it."); }
    } else if (f.id === "GD-SAMPLE-0007") {
      if (a === 0) { f.status = "resolved"; f.when = "resolved just now"; const d = D.devices.find(x => x.ip === "192.0.2.57"); d.known = true; d.name = "Smart plug"; toast("Named \"Smart plug\" and marked known."); }
      else { f.status = "affected"; f.sev = "high"; toast("Raised to high: block it on your router and change your Wi-Fi password."); }
    }
    route(); return;
  }
  if (ds.action) {
    const f = D.findings.find(x => x.id === ds.id);
    approvalModal(f, f.actions.find(a => a.id === ds.action)); return;
  }
  if (ds.doapprove) {
    const f = D.findings.find(x => x.id === ds.doapprove);
    const idx = f.actions.findIndex(a => a.id === ds.act);
    f._done = (f._done || []).concat(idx === 0 ? [0] : [1]);
    closeModal();
    if (f.id === "GD-SAMPLE-0001" && f._done.includes(0) && f._done.includes(1)) { f.status = "resolved"; f.when = "resolved just now"; D.exposure.internet = []; toast("Both fixes applied (mock). Rescan confirms: Alby Hub 1.24.0, no longer reachable from the internet."); }
    else if (f.id === "GD-SAMPLE-0003") { f.status = "resolved"; f.when = "resolved just now"; toast("Applied (mock). RPC now answers on the local network only."); }
    else toast("Applied (mock). Nothing real was changed.");
    D.approvals = D.approvals.filter(a => !(f.id === "GD-SAMPLE-0001" && ds.act === "act-upnp"));
    route(); return;
  }
  if (ds.approve) { D.approvals = D.approvals.filter(a => a.code !== ds.approve); const f = D.findings[0]; f._done = (f._done || []).concat([0]); D.exposure.internet = []; toast("Approved (mock). The router mapping is gone; the buddy probe will confirm."); route(); return; }
  if (ds.decline) { D.approvals = D.approvals.filter(a => a.code !== ds.decline); toast("Declined. The finding stays open."); route(); return; }
  if (ds.handled) { const f = D.findings.find(x => x.id === ds.handled); f.status = "resolved"; f.when = "resolved just now"; toast("Marked handled. The next scan checks it really is."); route(); return; }
  if (ds.accept) {
    modal("Accept the risk", `<p style="margin-top:0">Guard Dog will stop alerting about this until the date below, then ask again.</p>
      <label class="field">Why (for your future self)<textarea rows="3" placeholder="e.g. This port is only open while I'm travelling"></textarea></label>
      <label class="field" style="margin-top:10px">Ask me again in<select><option>7 days</option><option>30 days</option><option>90 days</option></select></label>`,
      `<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="acceptSave">Accept for now</button>`);
    return;
  }
  if (ds.preview) { alertPreview(D.findings.find(x => x.id === ds.preview)); return; }
  if (ds.known) { const d = D.devices.find(x => x.ip === ds.known); d.known = true; toast(`${d.name} marked as yours.`); route(); return; }
  if (ds.unknown) { toast("Kept as unknown. Block it on your router and check what it is."); return; }

  switch (t.id) {
    case "logo-refresh": e.preventDefault(); if ((location.hash || "#/overview") === "#/overview") { location.reload(); } else { location.hash = "#/overview"; } return;
    case "acceptSave": closeModal(); return toast("Accepted for now (mock). Guard Dog will ask again on the date you picked.");
    case "scanNow": return scanNow();
    case "previewAlert": case "previewAlert2": return alertPreview();
    case "theme-toggle": isDark = !isDark; return applyTheme(isDark);
    case "startWizard": case "startWizardMenu": e.preventDefault(); return wizard(0);
    case "registerBtn": case "wzRegister": return registerModal();
    case "regSave": closeModal(); return toast("Registered (mock). Guard Dog will now ask a few setup questions.");
    case "wzDone": closeModal(); location.hash = "#/overview"; return;
    case "testAlert": return toast("Test alert sent to Nostr DM, ntfy and email (mock).");
    case "probeBtn": return toast("Asked your buddy's Guard Dog for an outside-in probe. Results in about 2 minutes (mock).");
    case "announceBtn": return toast("Spend announced for the next 24 h: the alert for it will be quiet (mock).");
    case "plantBtn": return toast("You make and fund a decoy yourself; Guard Dog only watches it, it never holds the key (mock).");
    case "backupBtn": return toast("The backup checklist opens here (mock).");
    case "pairBtn": return toast("Pairing shows a one-time code to give your buddy (mock).");
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#nav-menu").hidden) { setMenu(false); $("#nav-menu-toggle").focus(); return; }
  if (e.key === "Escape" && $("#overlay").classList.contains("open")) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g.mapnode")) { e.preventDefault(); selDevice = e.target.dataset.dev; route(); }
});
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("change", (e) => {
  if (e.target.id === "sweepToggle") { activeSweep = e.target.checked; toast(activeSweep ? "Active sweep on: gentle, 50 packets/s, home subnet only." : "Active sweep off: Scout only listens."); route(); }
  if (e.target.dataset.chan) { const c = D.settings.channels.find(x => x.id === e.target.dataset.chan); c.on = e.target.checked; toast(`${c.name} ${c.on ? "on" : "off"}.`); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "repoForm") return;
  e.preventDefault();
  const v = $("#repoUrl").value.trim();
  if (!/^(https?:\/\/)?(github\.com|gitlab\.com|codeberg\.org)\/[\w.-]+\/[\w.-]+\/?$|^nostr:|^naddr1/i.test(v)) { toast("Paste a GitHub, GitLab or Codeberg address like https://github.com/owner/repo, or a nostr git address."); return; }
  const url = v.replace(/^https?:\/\//, "").replace(/\/$/, "");
  const r = { url, linked: "not linked yet", yours: "?", latest: "checking…", adv: 0 };
  D.repos.unshift(r);
  $("#repoRows").insertAdjacentHTML("afterbegin", repoRow(r));
  const row = $("#repoRows tr");
  if (hasGsap()) gsap.from(row, { backgroundColor: "var(--accent-soft)", duration: 1.2 });
  $("#repoUrl").value = "";
  setTimeout(() => { r.latest = "v1.2.0"; r.linked = "pick a running app…"; route(); toast("Watching. Latest release v1.2.0, no advisories (mock)."); }, 1100);
});

/* scan + theme */
function scanNow() {
  const btn = $("#scanNow"), ic = $("#scanIcon");
  btn.disabled = true; ic.classList.add("spin"); btn.querySelector("span").textContent = "Scanning…";
  setTimeout(() => {
    btn.disabled = false; ic.classList.remove("spin"); btn.querySelector("span").textContent = "Scan now";
    D.lastCheckMin = 0; toast("Scan finished: 24 things checked, nothing new (mock)."); route();
  }, 1600);
}
/* Theme toggle: the Sikorski Design System §6 block (canonical ids, key "theme", sun/moon, spin) */
const sunPath = "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z";
const moonPath = "M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z";
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
let isDark;
try { const savedTheme = localStorage.getItem("theme"); isDark = savedTheme ? savedTheme === "dark" : prefersDark.matches; } catch (_) { isDark = true; }
function applyTheme(dark, animate = true) {
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (_) {}
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.content = dark ? "#000000" : "#f5f5f7";
  if (window.gdFavicon) window.gdFavicon(dark);
  const themeIcon = document.getElementById("theme-icon");
  themeIcon.querySelector("path").setAttribute("d", dark ? sunPath : moonPath);
  if (animate && hasGsap()) gsap.fromTo(themeIcon, { rotation: 0, scale: 0.8 }, { rotation: 360, scale: 1, duration: 0.6, ease: "power2.out" });
}

/* Skins: Original plus six optional themes */
const SKINS = [
  { id: "original", name: "Original", vibe: "Black and white, glass and Inter. Light or dark.", light: null, sw: ["#000000", "#1c1c1e", "#ffffff", "#ff453a", "#30d158"] },
  { id: "cyberpunk", name: "Cyberpunk", vibe: "Neon cyan and magenta on a deep night sky.", light: false, sw: ["#0b0217", "#19062d", "#00f0ff", "#ff2e63", "#39ff14"] },
  { id: "terminal", name: "Terminal", vibe: "Green phosphor, monospace, square corners.", light: false, sw: ["#020a02", "#031103", "#33ff66", "#ff5555", "#50fa7b"] },
  { id: "beach", name: "Beach", vibe: "Sand, sea and coral with soft, round corners.", light: true, sw: ["#fbf5ea", "#ffffff", "#0a8ea0", "#d93d3d", "#2e9e6a"] },
  { id: "steampunk", name: "Steampunk", vibe: "Brass on walnut, parchment and serif type.", light: false, sw: ["#1e140c", "#342416", "#d4a24c", "#e2543a", "#8fbf6a"] },
  { id: "paper", name: "Paper", vibe: "Newsprint and ink. Calm, high contrast, prints well.", light: true, sw: ["#f4f1ea", "#fbfaf6", "#1a1a1a", "#b3261e", "#2e6b3f"] },
  { id: "forest", name: "Forest", vibe: "Moss, pine and birch. Easy on the eyes at night.", light: false, sw: ["#0f1a14", "#16261d", "#c8e6a0", "#ff6b5b", "#8fd694"] }
];
let currentSkin = "original";
try { currentSkin = localStorage.getItem("gd-skin") || "original"; } catch (_) {}
function applySkin(id) {
  const s = SKINS.find(x => x.id === id) || SKINS[0];
  currentSkin = s.id;
  if (s.id === "original") document.documentElement.removeAttribute("data-skin");
  else document.documentElement.setAttribute("data-skin", s.id);
  try { localStorage.setItem("gd-skin", s.id); } catch (_) {}
  if (s.light === null) { applyTheme(isDark, false); return; }
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.content = s.sw[0];
  if (window.gdFavicon) window.gdFavicon(!s.light);
}

/* boot */
(function boot() {
  applyTheme(isDark, false);
  applySkin(currentSkin);
  prefersDark.addEventListener("change", (e) => { isDark = e.matches; if (currentSkin === "original") applyTheme(isDark, true); });
  window.addEventListener("hashchange", route);
  const start = () => {
    if (!hasGsap()) document.documentElement.classList.add("no-gsap");
    route();
    let seen = false; try { seen = localStorage.getItem("gd-wizard-seen") === "1"; } catch (_) {}
    if (!seen) { wizard(0); try { localStorage.setItem("gd-wizard-seen", "1"); } catch (_) {} }
  };
  // GSAP is loaded with defer; wait for it briefly, then go on without it.
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
